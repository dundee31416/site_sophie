# CI/CD Pipeline for Lisons! (site_sophie)
#
# PRs and pushes to main run the gates: lint, tests, secret scan, dependency
# audits. Pushes to main additionally build backend+frontend images, push to
# GHCR tagged `latest` + short commit SHA, Trivy-scan the pushed images
# (CRITICAL vulnerabilities block the deploy), and deploy over SSH.
#
# Rollback: set IMAGE_TAG=<previous sha> in the host .env and re-run
# `docker compose -f docker-compose.prod.yml up -d`.
when:
  - event: push
    branch: main
  - event: pull_request

steps:
  - name: test-backend
    image: python:3.12-slim@sha256:97490e383c4cffb12825431fa24e3d2b70e39fd691a8e33c46bf4c18edca3998
    commands:
      - cd backend
      - pip install --quiet --no-cache-dir -r requirements-dev.txt
      - ruff check src tests
      - pytest -q

  - name: lint-frontend
    image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    commands:
      - cd frontend
      - npm ci --no-audit --no-fund
      - npm run lint
      - npx tsc -b --force

  - name: test-frontend
    image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    commands:
      - cd frontend
      - npm ci --no-audit --no-fund
      - npx vitest run

  - name: secret-scan
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - gitleaks detect --source . --no-banner --redact

  - name: audit-backend-deps
    image: python:3.12-slim@sha256:97490e383c4cffb12825431fa24e3d2b70e39fd691a8e33c46bf4c18edca3998
    commands:
      - pip install --quiet --no-cache-dir pip-audit
      - pip-audit -r backend/requirements.txt

  - name: audit-frontend-deps
    image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    commands:
      - cd frontend
      # audits package-lock.json directly; no node_modules install needed
      - npm audit --omit=dev --audit-level=high

  - name: build-backend
    image: plugins/docker@sha256:7a8e188c7dcaf15842d2a0bc22bf08d16f6a01279d8bb53c26f58afa17748458
    settings:
      repo: ghcr.io/dundee31416/site_sophie-backend
      registry: ghcr.io
      dockerfile: backend/Dockerfile
      context: backend
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      - event: push
        branch: main

  - name: build-frontend
    image: plugins/docker@sha256:7a8e188c7dcaf15842d2a0bc22bf08d16f6a01279d8bb53c26f58afa17748458
    settings:
      repo: ghcr.io/dundee31416/site_sophie-frontend
      registry: ghcr.io
      dockerfile: frontend/Dockerfile
      context: frontend
      target: production
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      - event: push
        branch: main

  - name: scan-images
    image: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
    environment:
      TRIVY_USERNAME:
        from_secret: docker_username
      TRIVY_PASSWORD:
        from_secret: docker_password
    commands:
      - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed ghcr.io/dundee31416/site_sophie-backend:${CI_COMMIT_SHA:0:8}
      - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed ghcr.io/dundee31416/site_sophie-frontend:${CI_COMMIT_SHA:0:8}
    when:
      - event: push
        branch: main

  - name: prepare-deploy-dir
    image: appleboy/drone-ssh@sha256:bf3b991d1778247754439739bb136b7be4fbdbafd58fe6f23bc36e4204598feb
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      port: 22
      script:
        - mkdir -p /mnt/ssd_pool/apps_data/site_sophie/pg_data
        - mkdir -p /mnt/ssd_pool/apps_data/site_sophie/storage
        - mkdir -p /mnt/ssd_pool/apps_data/site_sophie/inbox
        - mkdir -p /mnt/ssd_pool/apps_data/site_sophie/backups
    when:
      - event: push
        branch: main

  - name: copy-compose
    image: appleboy/drone-scp@sha256:0f6b3d49dd57f1ea2ca0ae573e54c4ad6575e032746a73661ba944d9dbf430ad
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      port: 22
      source: docker-compose.prod.yml
      target: /tmp
      strip_components: 0
    when:
      - event: push
        branch: main

  - name: deploy
    image: appleboy/drone-ssh@sha256:bf3b991d1778247754439739bb136b7be4fbdbafd58fe6f23bc36e4204598feb
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      port: 22
      envs:
        - DOCKER_USERNAME
        - DOCKER_PASSWORD
      script:
        - |
          bash <<'DEPLOY_SCRIPT_END'
          set -e
          echo "$DOCKER_PASSWORD" | sudo docker login ghcr.io -u "$DOCKER_USERNAME" --password-stdin
          mv /tmp/docker-compose.prod.yml /mnt/ssd_pool/apps_data/site_sophie/docker-compose.prod.yml
          cd /mnt/ssd_pool/apps_data/site_sophie
          test -f .env || { echo "FATAL: .env missing in apps_data/site_sophie"; exit 1; }
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${CI_COMMIT_SHA:0:8}/' .env
          else
            echo 'IMAGE_TAG=${CI_COMMIT_SHA:0:8}' >> .env
          fi
          sudo docker compose -f docker-compose.prod.yml pull
          sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans
          sudo docker image prune -f
          DEPLOY_SCRIPT_END
    environment:
      DOCKER_USERNAME:
        from_secret: docker_username
      DOCKER_PASSWORD:
        from_secret: docker_password
    when:
      - event: push
        branch: main
