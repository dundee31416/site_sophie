services:
  postgres:
    image: postgres:16-alpine
    container_name: site_sophie_pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    # IMAGE_TAG is pinned to the deployed commit SHA by CI; rollback = set the
    # previous SHA in .env and re-run `docker compose -f docker-compose.prod.yml up -d`.
    image: ghcr.io/dundee31416/site_sophie-backend:${IMAGE_TAG:-latest}
    container_name: site_sophie_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}
      STORAGE_ROOT: /data/storage
      INBOX_ROOT: /data/inbox
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      COOKIE_NAME: ${COOKIE_NAME:-lisons_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: '${CORS_ORIGINS:-[]}'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./storage:/data/storage
      - ./inbox:/data/inbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Runs as uid 10001 (non-root image). Writable paths: the two bind mounts
    # above (chown'd 10001:10001 on the host) and tmpfs /tmp — nothing else.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Nightly logical backups. ZFS snapshots cover disaster recovery; pg_dump
  # covers "the app corrupted its own data" and survives dataset-level mistakes.
  db-backup:
    image: postgres:16-alpine
    container_name: site_sophie_db_backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # healthchecks.io dead-man switch: pinged only on pg_dump success, so
      # silence past the grace period alerts — even if this whole host dies.
      # Empty disables the ping.
      HEALTHCHECKS_URL: ${HEALTHCHECKS_URL:-}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          if pg_dump -Fc -f "/backups/lisons-$$ts.dump"; then
            echo "backup ok: lisons-$$ts.dump"
            if [ -n "$$HEALTHCHECKS_URL" ]; then
              wget -q -T 10 -O /dev/null "$$HEALTHCHECKS_URL" || true
            fi
          fi
          find /backups -name 'lisons-*.dump' -mtime +$${BACKUP_KEEP_DAYS:-14} -delete
          sleep 86400
        done
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Offsite leg of 3-2-1: daily rclone sync of DB dumps + original scans to a
  # versioned iDrive e2 bucket. ZFS + pg_dump both die with the host; this
  # copy doesn't. Empty E2_* vars disable it (sidecar idles).
  offsite-sync:
    image: rclone/rclone:1.75@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
    container_name: site_sophie_offsite
    environment:
      # Remote "e2" defined entirely by env vars — no rclone.conf on disk
      RCLONE_CONFIG_E2_TYPE: s3
      RCLONE_CONFIG_E2_PROVIDER: IDrive
      RCLONE_CONFIG_E2_ACCESS_KEY_ID: ${E2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_E2_SECRET_ACCESS_KEY: ${E2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_E2_ENDPOINT: ${E2_ENDPOINT:-}
      E2_BUCKET: ${E2_BUCKET:-}
      # Separate healthchecks.io check from the pg_dump one — a shared check
      # cannot tell which leg died. Empty disables the ping.
      OFFSITE_HEALTHCHECKS_URL: ${OFFSITE_HEALTHCHECKS_URL:-}
    volumes:
      # read-only: the offsite leg must never be able to write app data
      - ./backups:/data/backups:ro
      - ./storage:/data/storage:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ -z "$$E2_BUCKET" ] || [ -z "$$RCLONE_CONFIG_E2_ACCESS_KEY_ID" ]; then
            echo "offsite disabled (E2_* not set)"
          elif rclone sync /data/backups "e2:$$E2_BUCKET/lisons/backups" --fast-list \
            && rclone sync /data/storage "e2:$$E2_BUCKET/lisons/storage" --fast-list; then
            echo "offsite sync ok: $$(date)"
            if [ -n "$$OFFSITE_HEALTHCHECKS_URL" ]; then
              wget -q -T 10 -O /dev/null "$$OFFSITE_HEALTHCHECKS_URL" || true
            fi
          else
            echo "offsite sync FAILED: $$(date)"
          fi
          sleep 86400
        done
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    image: ghcr.io/dundee31416/site_sophie-frontend:${IMAGE_TAG:-latest}
    container_name: site_sophie_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Host side stays ${WEB_PORT} (Cloudflare tunnel target unchanged);
      # container side is 8080 because nginx-unprivileged cannot bind 80.
      - "${WEB_PORT:-80}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
